[pytest]
# CanoPie QC suite.
#
# Markers exist so a change to one part of the app can be verified without
# running everything: see `python -m canopie.qc.which_tests <changed files>`,
# which turns a list of edited source paths into the exact pytest command.
#
# Anything touching utils.py / performance.py / raster_reader.py /
# project_tab.py must run `-m "extraction or contract"` -- those four underpin
# every consumer, so a change there can break a subsystem that looks unrelated.
testpaths = canopie/qc
markers =
    extraction: the scientific core -- pixel values, per-band stats, NoData, band math
    viewer: ImageViewer, in-viewport overlays (band/stretch/zoom bars), Inspect
    editor: ImageEditorDialog and the .ax edit pipeline
    ml: MachineLearningManager training and prediction export
    polygons: polygon/point creation, editing, grouping, PolygonManager
    io: readers and writers -- raster_reader, shapefile_io, loaders, project.json
    contract: cross-module invariants that must hold between subsystems
    perf: speed and memory budgets (deterministic counters + latency ceilings)
    slow: takes more than ~1s; excluded from the fast inner loop
