name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  qc:
    name: QC suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-xfixes0 libxcb-shape0 libxcb-cursor0 libdbus-1-3

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pytest-timeout
          pip install --no-deps .

      - name: The package starts (import + entry point)
        run: |
          python -c "import canopie.app, canopie._version as v; print('CanoPie', v.__version__)"

      - name: Qt starts (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          QT_DEBUG_PLUGINS=1 xvfb-run -a -s '-screen 0 1920x1080x24' python -c "
          from PyQt5 import QtWidgets
          app = QtWidgets.QApplication(['ci'])
          print('Qt platform:', app.platformName())
          " 2>&1 | tail -40

      # The suite runs in parts (as in CONTRIBUTING.md): one process for every
      # file keeps the Qt / raster caches of hundreds of tests from piling up.
      - name: QC suite
        timeout-minutes: 60
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then RUN="xvfb-run -a -s '-screen 0 1920x1080x24'"; else RUN=""; fi
          status=0
          # A part is retried ONCE only when its process dies natively (no
          # report written: the rare PyQt5/Windows crash documented in
          # canopie/qc/conftest.py). A test that fails is never retried.
          run_once() {
            rm -f canopie/qc/last_run_report.txt
            eval $RUN python -u -m pytest "$@" -v -p no:cacheprovider --timeout=600 --durations=15
          }
          run_part() {
            echo "::group::$1"
            run_once "${@:2}"; rc=$?
            if [ ! -f canopie/qc/last_run_report.txt ]; then
              echo "::warning::$1: the test process died natively (exit $rc) -- retrying the part once"
              run_once "${@:2}"; rc=$?
            fi
            [ $rc -ne 0 ] && status=1
            mkdir -p qc_reports
            if [ -f canopie/qc/last_run_report.txt ]; then
              grep -E "TOTAL|FAILED" canopie/qc/last_run_report.txt || true
              cp canopie/qc/last_run_report.txt "qc_reports/$1.txt"
            fi
            echo "::endgroup::"
          }
          run_part "a-o" canopie/qc/test_[a-o]*.py
          run_part "p-s" canopie/qc/test_[p-s]*.py
          for f in canopie/qc/test_[t-z]*.py; do run_part "$(basename "$f")" "$f"; done
          exit $status

      - name: QC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qc-report-${{ matrix.os }}
          path: qc_reports/
          if-no-files-found: ignore
